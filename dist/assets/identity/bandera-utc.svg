<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" aria-label="Bandera oficial Unión Tecnocrática Colombiana - Proporción 3:5">
  <defs>
    <linearGradient id="flagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="30%" stop-color="#0D0518"/>
      <stop offset="60%" stop-color="#1A0B2E"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="bandDiagonal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B3AFF"/>
      <stop offset="50%" stop-color="#A85FFF"/>
      <stop offset="100%" stop-color="#C480FF"/>
    </linearGradient>
    <linearGradient id="lifeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D47A"/>
      <stop offset="50%" stop-color="#3AFF9E"/>
      <stop offset="100%" stop-color="#00D47A"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,240,255,0.8)"/>
      <stop offset="100%" stop-color="rgba(0,240,255,0)"/>
    </radialGradient>
    <filter id="flagBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 60 L60 0 M60 60 L60 60" stroke="rgba(139,58,255,0.03)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1500" height="900" fill="url(#flagBg)"/>
  <rect width="1500" height="900" fill="url(#gridPattern)"/>

  <!-- Banda diagonal central (35°) - 1/5 del alto = 180px -->
  <polygon points="0,720 1500,180 1500,360 0,900" fill="url(#bandDiagonal)" opacity="0.95" filter="url(#flagBloom)"/>

  <!-- Línea de vida Gaia (franja inferior 5px en 900 = ~5.4px, redondeamos a 6px) -->
  <rect x="0" y="894" width="1500" height="6" fill="url(#lifeLine)"/>

  <!-- Logo centrado en la intersección banda/centro -->
  <!-- Centro de la bandera: 750, 450. Intersección banda diagonal con centro vertical -->
  <g transform="translate(750, 360) scale(0.7)" filter="url(#flagBloom)">
    <!-- Versión simplificada del logo para bandera -->
    <!-- Raíces -->
    <path d="M0 60 Q-50 80 -80 100 Q-110 110 -120 105" stroke="#00D47A" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M0 60 Q50 80 80 100 Q110 110 120 105" stroke="#00D47A" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <circle cx="-80" cy="100" r="4" fill="#00D47A" opacity="0.9"/>
    <circle cx="80" cy="100" r="4" fill="#00D47A" opacity="0.9"/>

    <!-- Tronco -->
    <path d="M-20 60 Q-15 30 5 0 Q25 30 20 60" fill="url(#bandDiagonal)" opacity="0.95"/>

    <!-- Copas/Ramas -->
    <path d="M-20 0 Q-60 -30 -100 -50" stroke="#00F0FF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M20 0 Q60 -30 100 -50" stroke="#00F0FF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M0 0 Q0 -50 0 -80" stroke="#8B3AFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="1"/>
    <circle cx="-100" cy="-50" r="5" fill="#00F0FF" opacity="0.9"/>
    <circle cx="100" cy="-50" r="5" fill="#00F0FF" opacity="0.9"/>
    <circle cx="0" cy="-80" r="7" fill="#8B3AFF" opacity="1"/>

    <!-- Colibrí simplificado -->
    <g transform="translate(0, -50)">
      <ellipse cx="0" cy="0" rx="12" ry="8" fill="#8B3AFF" opacity="0.9"/>
      <path d="M-12 0 Q-25 -10 -30 0 Q-25 10 -12 0" fill="#00F0FF" opacity="0.7"/>
      <circle cx="8" cy="-3" r="2.5" fill="#000"/>
      <circle cx="9" cy="-4" r="1" fill="#00F0FF"/>
    </g>
  </g>

  <!-- 3 Estrellas en vértices triángulo áureo -->
  <!-- Vértice 1: Fundadores (arriba-centro, desplazado hacia la banda) -->
  <g transform="translate(750, 180)" filter="url(#flagBloom)">
    <polygon points="0,-30 5,-18 22,-18 10,-6 15,6 0,0 -15,6 -10,-6 -22,-18 -5,-18" fill="#00F0FF" opacity="0.95">
      <animate attributeName="opacity" values="0.95;1;0.95" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <ellipse cx="0" cy="-12" rx="35" ry="25" fill="url(#starGlow)" opacity="0.4"/>
  </g>

  <!-- Vértice 2: Pueblo (esquina inferior izquierda, zona negra) -->
  <g transform="translate(200, 750)" filter="url(#flagBloom)">
    <polygon points="0,-20 3,-12 15,-12 7,-4 10,4 0,0 -10,4 -7,-4 -15,-12 -3,-12" fill="#00F0FF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/>
    </polygon>
    <ellipse cx="0" cy="-8" rx="25" ry="18" fill="url(#starGlow)" opacity="0.3"/>
  </g>

  <!-- Vértice 3: IA (esquina inferior derecha, zona morada) -->
  <g transform="translate(1300, 750)" filter="url(#flagBloom)">
    <polygon points="0,-20 3,-12 15,-12 7,-4 10,4 0,0 -10,4 -7,-4 -15,-12 -3,-12" fill="#8B3AFF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <ellipse cx="0" cy="-8" rx="25" ry="18" fill="url(#starGlow)" opacity="0.3"/>
  </g>

  <!-- Marca de agua sutil: "UTC" en binario en las esquinas -->
  <g font-family="monospace" font-size="14" fill="rgba(139,58,255,0.03)" letter-spacing="2">
    <text x="40" y="40">01010101 01010100 01000011</text>
    <text x="1200" y="40" text-anchor="end">01010101 01010100 01000011</text>
    <text x="40" y="870">01001101 01000101 01000100 01001001 01001101 01001111 01010011 00100000 01010000 01010010 01001111 01011001 01000101 01000011 01010100 01000001 01001101 01001111 01010011 00100000 01000101 01010110 01001111 01001100 01010101 01000011 01001001 01001111 01001110 01000001 01001101 01001111 01010011</text>
    <text x="1460" y="870" text-anchor="end">01001101 01000101 01000100 01001001 01001101 01001111 01010011 00100000 01010000 01010010 01001111 01011001 01000101 01000011 01010100 01000001 01001101 01001111 01010011 00100000 01000101 01010110 01001111 01001100 01010101 01000011 01001001 01001111 01001110 01000001 01001101 01001111 01010011</text>
  </g>
</svg>